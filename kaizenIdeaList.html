<script>

    // KPI Calculations

    const totalIdeas = kaizenIdeas.length;

    const completedIdeas = kaizenIdeas.filter(item =>
        item.status === "Completed" ||
        item.status === "Implemented"
    ).length;

    const picCounts = {};

    kaizenIdeas.forEach(item => {

        if(item.pic){

            picCounts[item.pic] =
                (picCounts[item.pic] || 0) + 1;
        }

    });

    const topContributor =
        Object.entries(picCounts)
        .sort((a,b) => b[1]-a[1])[0];


    // KPI UI

    document.getElementById("totalIdeas").innerText =
        totalIdeas;

    document.getElementById("completedIdeas").innerText =
        completedIdeas;

    document.getElementById("contributors").innerText =
        Object.keys(picCounts).length;

    document.getElementById("topContributor").innerText =
        topContributor[0];


    // TABLE RENDERING

    const tableBody =
        document.getElementById("tableBody");

    kaizenIdeas.forEach(item => {

        let badgeClass = "bg-secondary";

        if(item.status === "Completed" ||
           item.status === "Implemented"){

            badgeClass = "bg-success";
        }

        else if(item.status === "In Progress"){

            badgeClass = "bg-warning text-dark";
        }

        else if(item.status === "Planned"){

            badgeClass = "bg-primary";
        }

        tableBody.innerHTML += `

            <tr>

                <td>${item.id}</td>

                <td>${item.project}</td>

                <td>${item.kaizenName}</td>

                <td>
                    <span class="badge ${badgeClass}">
                        ${item.status}
                    </span>
                </td>

                <td class="description">
                    ${item.description}
                </td>

                <td>${item.PlannedStartDate || "-"}</td>

                <td>${item.PlannedEndDate || "-"}</td>

                <td>${item.pic || "-"}</td>

            </tr>

        `;
    });


    // CHART

    const ctx =
        document.getElementById('kaizenChart');

    new Chart(ctx, {

        type: 'bar',

        data: {

            labels: Object.keys(picCounts),

            datasets: [{

                label: 'Kaizen Ideas',

                data: Object.values(picCounts),

                backgroundColor: '#0077b6',

                borderRadius: 6

            }]
        },

        options: {

            responsive: true,

            plugins: {

                legend: {

                    display: false
                }
            },

            scales: {

                y: {

                    beginAtZero: true
                }
            }
        }
    });

</script>
